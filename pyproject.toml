[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-dossier-pipeline"
version = "0.1.0"
description = "Scrape job listings via Firefox and create AI-tailored Draft applications in Dossier via MCP."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
scrape-to-dossier = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "cookies", "dossier", "marionette", "scraper"]
